name: ais

# Écoute en continu le trafic AIS (aisstream.io) sur les zones de scripts/fetch_ais.py
# et publie ais.json toutes les 2 min 30 sur la branche « ais ».
# Chaque lancement dure ~5 h 40 ; un lancement est programmé chaque heure : il attend
# que le précédent se termine puis prend le relais (une seule écoute à la fois).
on:
    schedule:
        - cron: '11 * * * *'
    workflow_dispatch:

permissions:
    contents: write
    actions: write # pour relancer le lancement suivant

concurrency:
    group: ais
    cancel-in-progress: false

jobs:
    ais:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        steps:
            - uses: actions/checkout@v4

            - name: Récupérer le relevé précédent
              run: |
                  git fetch -q --depth 1 origin ais && git worktree add -q ais-previous origin/ais || echo "Premier relevé"

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - run: pip install websockets

            - name: Écouter le flux AIS et publier
              env:
                  AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
                  RUN_MINUTES: '340'
                  PUBLISH_EVERY: '150'
                  PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              run: python scripts/fetch_ais.py

            # Relais : lance le lancement suivant juste avant la fin de celui-ci
            # (la programmation horaire de GitHub n'est pas fiable ; elle reste en secours)
            - name: Lancer la suite
              if: success() # pas de relance en boucle si le relevé échoue (ex. clé refusée)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run "ais.yml" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
