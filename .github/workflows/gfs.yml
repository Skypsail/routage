name: gfs-longue-portee

# Surveille la NOAA : toutes les 15 min, vérifie si un run GFS plus récent est complet
# (jusqu'à +384 h) ; si oui, le télécharge (vent + vagues GFS-Wave) et le publie sur la branche « gfs ».
# Chaque lancement dure ~5 h 40 puis relance lui-même le suivant ;
# la programmation horaire de GitHub (peu fiable) reste en secours.
on:
    schedule:
        - cron: '23 * * * *'
    workflow_dispatch:

permissions:
    contents: write
    actions: write # pour relancer le lancement suivant

concurrency:
    group: gfs
    cancel-in-progress: false

jobs:
    gfs:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Installer ecCodes (lecture des fichiers GRIB)
              run: pip install eccodes

            - name: Surveiller les runs GFS et publier
              run: |
                  END=$(( $(date +%s) + 340 * 60 ))
                  REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
                  while [ "$(date +%s)" -lt "$END" ]; do
                    # Heure du run actuellement publié
                    META=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/gfs/gfs.json?t=$(date +%s)")
                    PUBLISHED_REF=$(echo "$META" | python -c "import sys,json; print(json.load(sys.stdin).get('ref',0))" 2>/dev/null || echo 0)
                    PUBLISHED_WAVES=$(echo "$META" | python -c "import sys,json; print(1 if json.load(sys.stdin).get('waves') else 0)" 2>/dev/null || echo 0)
                    export PUBLISHED_REF PUBLISHED_WAVES
                    rm -rf gfs
                    if python scripts/fetch_gfs.py && [ -f gfs/gfs.bin ]; then
                      cd gfs
                      git init -q -b gfs
                      git add -A
                      git -c user.name="gfs-bot" -c user.email="gfs-bot@users.noreply.github.com" \
                          commit -q -m "GFS $(date -u +'%d/%m %H:%M') UTC"
                      git push -f -q "$REMOTE" gfs && echo "$(date -u +%H:%M) nouveau run publié"
                      cd ..
                    fi
                    sleep 900
                  done

            # Relais : lance le lancement suivant juste avant la fin de celui-ci
            - name: Lancer la suite
              if: success()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run "gfs.yml" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
