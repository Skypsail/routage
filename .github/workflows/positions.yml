name: positions-rdr

# Le pos report est publié une fois par heure, dans les premières minutes.
# On interroge le FTP toutes les 2 min entre H et H+12 min, et on s'arrête
# dès que le relevé de l'heure est récupéré ; le reste du temps, la tâche dort.
# Chaque lancement dure ~5 h 40 ; un lancement est programmé chaque heure : il attend
# que le précédent se termine puis prend le relais (une seule surveillance à la fois).
on:
    schedule:
        - cron: '41 * * * *'
    workflow_dispatch:

permissions:
    contents: write
    actions: write # pour relancer le lancement suivant

concurrency:
    group: positions
    cancel-in-progress: false

jobs:
    fetch:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Surveiller le FTP et publier
              env:
                  FTP_HOSTS: ${{ secrets.FTP_HOSTS }}
                  FTP_USER: ${{ secrets.FTP_USER }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  git config user.name "positions-bot"
                  git config user.email "positions-bot@users.noreply.github.com"
                  END=$(( $(date +%s) + 340 * 60 ))
                  DONE_HOUR=""   # heure dont le relevé a déjà été récupéré
                  while [ "$(date +%s)" -lt "$END" ]; do
                    MIN=$((10#$(date -u +%M)))
                    HOUR=$(date -u +%Y%m%d%H)
                    # Fenêtre H+0 → H+12 min, tant que le relevé de l'heure n'est pas arrivé
                    if [ "$MIN" -le 12 ] && [ "$HOUR" != "$DONE_HOUR" ]; then
                      # Toujours repartir de la dernière version publiée (évite tout conflit si une autre
                      # exécution ou une modification à la main a touché le dépôt entre-temps)
                      git rebase --abort 2>/dev/null || true
                      git fetch -q origin "${{ github.ref_name }}" && git reset -q --hard "origin/${{ github.ref_name }}"
                      if OUT=$(python scripts/fetch_positions.py 2>&1); then
                        echo "$OUT" | grep -E "positions lues|LASTFIX|nouvelle|Rien de nouveau|ignorée" | tail -4
                        git add positions.json data/history.json
                        if ! git diff --cached --quiet; then
                          git commit -q -m "Positions $(date -u +'%d/%m %H:%M') UTC"
                          if git push -q origin "HEAD:${{ github.ref_name }}"; then
                            echo "$(date -u +%H:%M) publié"
                          else
                            # Le dépôt a bougé entre-temps : on abandonne ce commit, le relevé sera
                            # recalculé à partir de la version publiée au prochain essai (2 min)
                            echo "$(date -u +%H:%M) publication refusée (dépôt modifié entre-temps), nouvel essai"
                            git reset -q --hard "origin/${{ github.ref_name }}"
                            sleep 120
                            continue
                          fi
                        fi
                        # Relevé de l'heure reçu (position datée de cette heure) : on arrête jusqu'à H+1
                        if echo "$OUT" | grep -q "LASTFIX_HOUR=$HOUR"; then
                          DONE_HOUR=$HOUR
                          echo "$(date -u +%H:%M) relevé de l'heure récupéré, pause jusqu'à la prochaine heure"
                        fi
                      else
                        echo "$(date -u +%H:%M) relevé en échec, nouvel essai dans 2 min :"
                        echo "$OUT" | tail -5
                      fi
                      sleep 120
                    else
                      sleep 30
                    fi
                  done

            # Relais : lance le lancement suivant juste avant la fin de celui-ci
            # (la programmation horaire de GitHub n'est pas fiable ; elle reste en secours)
            - name: Lancer la suite
              if: success() # pas de relance en boucle si le relevé échoue (ex. clé refusée)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh workflow run "positions.yml" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
